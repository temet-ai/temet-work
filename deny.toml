# cargo-deny (the CI workflow): licences temet-work may ship, known advisories,
# and where crates come from. Keep the licence list the same as about.toml.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[advisories]
yanked = "deny"
# Each ignore names the crate it is reached through, why it stays, and the date
# it was checked, e.g.
# { id = "RUSTSEC-2025-0141", reason = "bincode, through syntect; unmaintained, no replacement (checked 2026-10-15)" },
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
