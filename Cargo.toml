[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Every third-party version and every internal crate, once. Crates say
# `foo.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.2"
serde_json = "1"
toml = "1"
sha2 = "0.11"
# Reads the clock time on an agent's error line in the daemon's time zone.
jiff = { version = "1.0", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
rustix = { version = "1.1", features = ["net"] }
temet-work-core = { path = "crates/core" }
temet-work-tracker = { path = "crates/tracker" }
temet-work-codehost = { path = "crates/codehost" }
temet-work-codehost-github = { path = "crates/codehost-github" }
temet-work-codehost-gitlab = { path = "crates/codehost-gitlab" }
temet-work-deploy = { path = "crates/deploy" }
temet-work-checkout = { path = "crates/checkout" }
temet-work-runner = { path = "crates/runner" }
temet-work-runtime = { path = "crates/runtime" }
temet-work-tracker-github = { path = "crates/tracker-github" }
temet-work-tracker-jira = { path = "crates/tracker-jira" }
temet-work-runner-herdr = { path = "crates/runner-herdr" }
temet-work-runtime-claude = { path = "crates/runtime-claude" }
temet-work-runtime-codex = { path = "crates/runtime-codex" }
temet-work-store = { path = "crates/store" }
temet-work-style = { path = "crates/style" }
temet-work-mike = { path = "crates/mike" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

# The root package wires the parts: src/lib.rs registers each one behind its
# feature, and tests/ checks the boundaries and every mix.
[package]
name = "temet-work"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# One feature per part, all on by default. An adapter's feature turns on its
# family. `cargo run --no-default-features --features tracker` builds one part
# alone; scripts/check-mixes builds every mix that matters.
[features]
default = ["tracker", "runner", "runtime", "codehost", "deploy", "checkout", "store", "style", "mike", "tracker-github", "tracker-jira", "runner-herdr", "runtime-claude", "runtime-codex", "codehost-github", "codehost-gitlab"]
tracker = ["dep:temet-work-tracker"]
runner = ["dep:temet-work-runner"]
runtime = ["dep:temet-work-runtime"]
codehost = ["dep:temet-work-codehost"]
deploy = ["dep:temet-work-deploy"]
checkout = ["dep:temet-work-checkout"]
store = ["dep:temet-work-store"]
style = ["dep:temet-work-style"]
mike = ["dep:temet-work-mike"]
tracker-github = ["tracker", "dep:temet-work-tracker-github"]
tracker-jira = ["tracker", "dep:temet-work-tracker-jira"]
runner-herdr = ["runner", "dep:temet-work-runner-herdr"]
runtime-claude = ["runtime", "dep:temet-work-runtime-claude"]
runtime-codex = ["runtime", "dep:temet-work-runtime-codex"]
codehost-github = ["codehost", "dep:temet-work-codehost-github"]
codehost-gitlab = ["codehost", "dep:temet-work-codehost-gitlab"]

[dependencies]
temet-work-core.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
temet-work-tracker = { workspace = true, optional = true }
temet-work-runner = { workspace = true, optional = true }
temet-work-runtime = { workspace = true, optional = true }
temet-work-codehost = { workspace = true, optional = true }
temet-work-deploy = { workspace = true, optional = true }
temet-work-checkout = { workspace = true, optional = true }
temet-work-store = { workspace = true, optional = true }
temet-work-style = { workspace = true, optional = true }
temet-work-mike = { workspace = true, optional = true }
temet-work-tracker-github = { workspace = true, optional = true }
temet-work-tracker-jira = { workspace = true, optional = true }
temet-work-runner-herdr = { workspace = true, optional = true }
temet-work-runtime-claude = { workspace = true, optional = true }
temet-work-runtime-codex = { workspace = true, optional = true }
temet-work-codehost-github = { workspace = true, optional = true }
temet-work-codehost-gitlab = { workspace = true, optional = true }

# SO_PEERCRED, to read who sent a request on the daemon's socket.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[dev-dependencies]
temet-work-runtime-codex.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# Dependencies optimised even in dev builds. Line tables only, so test binaries
# stay small.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
debug = "line-tables-only"
