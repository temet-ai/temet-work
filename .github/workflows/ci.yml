name: CI

# Every pull request and push to main, Linux only: the full platform matrix runs
# on release tags (release.yml), so a PR push costs minutes, not hours.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # .cargo/config.toml links with mold on Linux; runners have none.
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: Format
        run: cargo fmt --all --check
      - name: Licences, advisories and sources
        run: cargo deny check
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --all-features --locked --profile ci
      # A crate whose suite passes 10 s fails the build (docs/architecture.md, "Tests").
      - name: Test time budget
        run: scripts/test-budget target/nextest/ci/junit.xml --seconds 10
      # No parts, each part alone, all parts, each adapter with its family.
      - name: Mixes
        run: scripts/check-mixes

  # The desktop app is a workspace of its own (docs/ui.md), so the job above does not
  # build it. No path filter: a change to the core or the style crate that breaks the
  # app fails here, on its own pull request.
  app:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # cargo reads the root .cargo/config.toml from app/ too, so the app links with mold.
      - uses: rui314/setup-mold@v1
      # The window's platform crate (gpui-pre-platform, Wayland) links these system libraries.
      - name: System libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev
          libwayland-dev
          libfontconfig1-dev
          libfreetype-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The job above formats the main workspace only.
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --locked --profile ci --config-file ../.config/nextest.toml
      - name: Test time budget
        run: ../scripts/test-budget target/nextest/ci/junit.xml --seconds 10

  # A Node package (renderer, sidecar, web UI): one job each, in its folder.
  # node:
  #   runs-on: ubuntu-22.04
